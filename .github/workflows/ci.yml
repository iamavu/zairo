name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # trailmark (a core dependency) requires Python >=3.12 --
          # matches pyproject.toml's requires-python. No matrix: there's
          # only one supported version to test.
          python-version: "3.12"

      - name: Configure git identity (required by tests that create commits)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Build sdist and wheel
        run: python -m build
