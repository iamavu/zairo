[project]
name = "zairo"
dynamic = ["version"]
description = "Security review for code changes: follows a git diff through the call graph and has an LLM check what it affects for vulnerabilities, with HTML, JSON and SARIF reports and a CI gate."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "iamavu", email = "imailavantika@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.27",
    "rich>=15.0",
    "jinja2>=3.1",
    "litellm>=1.98",
    "trailmark>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build>=1.0",
]
# For tests/test_report_html.py, which opens report.html in a browser; it's
# skipped without this. Then: python -m playwright install chromium
browser = [
    "playwright>=1.45",
]

[project.scripts]
zairo = "zairo.cli:main"

[project.urls]
Repository = "https://github.com/iamavu/zairo"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "zairo.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zairo = ["templates/*.html", "templates/vendor/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
