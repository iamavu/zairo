# Example workflow for a repo that wants zairo to scan every PR and block
# merges on high/critical findings the PR introduces. Copy this into your
# own repo's .github/workflows/ (this file is not run by the zairo repo
# itself). Pair it with zairo-warm-up.yml, which writes the notes this scan
# reads from your default branch.
name: zairo security scan

on:
  pull_request:

permissions:
  contents: read
  security-events: write  # required to upload SARIF to the Security tab

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need base branch history for `git diff` to work

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install zairo

      # Notes written by zairo-warm-up.yml on the default branch: restored,
      # never saved from here, so a PR's code never writes the notes later
      # scans trust.
      - name: Restore warm-up notes
        uses: actions/cache/restore@v4
        with:
          path: zairo_out/.notes_cache.json
          key: zairo-notes-${{ github.event.pull_request.base.sha }}
          restore-keys: zairo-notes-

      # Answers from earlier runs on this PR: a new push only asks the model
      # about symbols whose prompt changed. Caches saved by a PR's runs are
      # only visible to that PR.
      - name: Restore LLM answers
        uses: actions/cache/restore@v4
        with:
          path: zairo_out/.llm_cache.json
          key: zairo-llm-${{ github.event.pull_request.number }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: zairo-llm-${{ github.event.pull_request.number }}-

      - name: Run zairo (diff PR base..head, fail on high/critical it introduces)
        env:
          # Whichever API key your --model provider needs — see LiteLLM's
          # provider docs (https://docs.litellm.ai/docs/providers).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          zairo . \
            --from "origin/${{ github.base_ref }}" --to HEAD \
            --fail-on high \
            --output zairo_out
        continue-on-error: true
        id: scan

      # Saved even when the gate fails -- that's the run most likely to be
      # pushed to again. (actions/cache's own save skips failed jobs.)
      - name: Save LLM answers
        if: always()
        uses: actions/cache/save@v4
        with:
          path: zairo_out/.llm_cache.json
          key: zairo-llm-${{ github.event.pull_request.number }}-${{ github.sha }}-${{ github.run_attempt }}

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: zairo_out/report.sarif

      - name: Fail the job if the gate failed
        if: steps.scan.outcome == 'failure'
        run: exit 1
